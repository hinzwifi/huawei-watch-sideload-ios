name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          mkdir -p WatchApps
          export HUASIDELOAD_TEAM_ID=""
          export HUASIDELOAD_BUNDLE_ID="com.hinzwifi.huasideload"
          xcodegen generate

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project HuaSideload.xcodeproj \
            -scheme HuaSideload \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            BUILD_DIR=build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/HuaSideload.app Payload/
          codesign --force --deep --sign - Payload/HuaSideload.app
          zip -r HuaSideload.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuaSideload
          path: HuaSideload.ipa
          retention-days: 14
